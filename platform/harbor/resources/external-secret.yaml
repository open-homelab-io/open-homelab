apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        HARBOR_ADMIN_PASSWORD: "{{ .admin_password }}"
        username: "{{ .db_username }}"
        password: "{{ .db_password }}"
        secretKey: "{{ .secret_key }}"
        secret: "{{ .core_secret }}"
        CSRF_KEY: "{{ .csrf_key }}"
        JOBSERVICE_SECRET: "{{ .jobservice_secret }}"
        REGISTRY_HTTP_SECRET: "{{ .registry_http_secret }}"
        CONFIG_OVERWRITE_JSON: >-
          {"auth_mode":"oidc_auth","oidc_name":"Keycloak","oidc_endpoint":"https://auth.lab.example.com/realms/master","oidc_client_id":"harbor","oidc_client_secret":"{{ .oidc_client_secret }}","oidc_groups_claim":"groups","oidc_admin_group":"harbor-admins","oidc_scope":"openid,profile,email","oidc_verify_cert":false,"oidc_auto_onboard":true,"oidc_user_claim":"email","project_creation_restriction":"adminonly","self_registration":false}
  data:
    - secretKey: admin_password
      remoteRef:
        key: platform/harbor/core
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret_key
      remoteRef:
        key: platform/harbor/core
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: db_username
      remoteRef:
        key: platform/harbor/core
        property: db_username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: db_password
      remoteRef:
        key: platform/harbor/core
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: core_secret
      remoteRef:
        key: platform/harbor/core
        property: core_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: csrf_key
      remoteRef:
        key: platform/harbor/core
        property: csrf_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: jobservice_secret
      remoteRef:
        key: platform/harbor/core
        property: jobservice_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: registry_http_secret
      remoteRef:
        key: platform/harbor/core
        property: registry_http_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: oidc_client_secret
      remoteRef:
        key: platform/keycloak/clients/harbor
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

apiVersion: v1
kind: Service
metadata:
  name: keycloak-metrics
  namespace: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/component: metrics
    app.kubernetes.io/instance: keycloak
  annotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/job: keycloak
    k8s.grafana.com/metrics.path: /metrics
    k8s.grafana.com/metrics.portName: management
spec:
  type: ClusterIP
  selector:
    app: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/managed-by: keycloak-operator
  ports:
    - name: management
      port: 9000
      protocol: TCP
      targetPort: management

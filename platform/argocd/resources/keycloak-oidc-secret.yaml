apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-keycloak-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: oidc.keycloak.clientSecret
      remoteRef:
        key: platform/keycloak/clients/argocd
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-oauth2-proxy
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: longhorn-oauth2-proxy
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: platform/keycloak/clients/longhorn
        property: client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client-secret
      remoteRef:
        key: platform/keycloak/clients/longhorn
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: cookie-secret
      remoteRef:
        key: platform/longhorn/oauth2-proxy
        property: cookie_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

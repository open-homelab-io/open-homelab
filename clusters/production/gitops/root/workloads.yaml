apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/open-homelab-io/open-homelab.git
    targetRevision: swap-flannel-for-cilium
    path: workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: https://github.com/open-homelab-io/open-homelab.git
    targetRevision: swap-flannel-for-cilium
    path: platform/dns
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
